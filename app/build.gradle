plugins { id 'com.android.application' }

android {
    namespace 'studio.sotto.mobile'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'studio.sotto.mobile'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.1.1'
        testInstrumentationRunner 'studio.sotto.mobile.SmokeInstrumentation'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            def configFile = rootProject.file('signing.properties')
            if (configFile.exists()) {
                def values = new Properties(); configFile.withInputStream { values.load(it) }
                storeFile rootProject.file(values.getProperty('storeFile'))
                storePassword values.getProperty('storePassword')
                keyAlias values.getProperty('keyAlias')
                keyPassword values.getProperty('keyPassword')
            }
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
    testOptions { unitTests.returnDefaultValues = true }
}

dependencies {
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.activity:activity:1.11.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
